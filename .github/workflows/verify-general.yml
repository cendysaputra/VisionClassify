name: Verify General mode

# Rebuild the General mode label embeddings with scripts/build_general_embeddings.py,
# score the previous pack and the rebuilt ones on the CIFAR-100 benchmark in
# scripts/eval_general.py, record the comparison, and commit the pack built with the
# script's default templates so the file in git always comes from code.
# Runs on branches other than main.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/verify-general.yml
      - scripts/build_general_embeddings.py
      - scripts/eval_general.py
      - general_labels.py
      - general.py
      - .gitignore

permissions:
  contents: write

concurrency:
  group: verify-general-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GENERAL_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install onnxruntime==1.23.2 numpy==2.2.6 pillow==12.0.0 tokenizers pytest==9.2.0

      - name: Download CIFAR-100
        run: |
          mkdir -p data
          curl -sSL -o data/cifar-100-python.tar.gz https://www.cs.toronto.edu/~kriz/cifar-100-python.tar.gz
          echo "eb9058c3a382ffc7106e4002c42a8d85  data/cifar-100-python.tar.gz" | md5sum -c
          tar xzf data/cifar-100-python.tar.gz -C data

      - name: Rebuild embeddings
        run: |
          mkdir -p rebuilt
          cp data/general_label_embeddings.npz rebuilt/previous.npz
          python scripts/build_general_embeddings.py --templates single --output rebuilt/single.npz
          python scripts/build_general_embeddings.py --templates ensemble --output rebuilt/ensemble.npz

      - name: Compare with committed pack
        run: |
          python - <<'PY'
          import numpy as np
          committed = np.load("rebuilt/previous.npz")
          for name in ("single", "ensemble"):
              other = np.load(f"rebuilt/{name}.npz")
              same_layout = np.array_equal(committed["label_index"], other["label_index"])
              same_shape = committed["embeddings"].shape == other["embeddings"].shape
              if same_shape:
                  cos = (committed["embeddings"] * other["embeddings"]).sum(1)
                  print(
                      f"{name}: same layout {same_layout}, row cosine min {cos.min():.4f} "
                      f"mean {cos.mean():.4f}, max abs diff {np.abs(committed['embeddings'] - other['embeddings']).max():.2e}"
                  )
              else:
                  print(
                      f"{name}: embedding shape changed from {committed['embeddings'].shape} "
                      f"to {other['embeddings'].shape}"
                  )
          PY

      - name: Commit the pack built from code
        if: github.ref != 'refs/heads/main'
        run: |
          # The committed pack must be the one the script builds (AGENTS.md rule 12).
          # Copy it into place first, then run a single batch-1 vision pass that scores
          # the previous pack (when compatible), single-template and ensemble packs, and
          # writes both results/general_metrics.json and results/general_comparison.json.
          cp rebuilt/single.npz data/general_label_embeddings.npz
          python scripts/eval_general.py --write-results \
            --compare \
              previous_committed_pack=rebuilt/previous.npz \
              built_single_templates=rebuilt/single.npz \
              built_ensemble_templates=rebuilt/ensemble.npz \
            --comparison-out results/general_comparison.json
          GENERAL_LIVE=1 pytest tests/test_general_live.py
          if ! git diff --quiet -- data/general_label_embeddings.npz results/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/general_label_embeddings.npz results/general_metrics.json results/general_comparison.json
            git commit -m "Record General mode pack built from code (run ${{ github.run_id }})"
            git pull --rebase
            git push
          fi
