name: Fine-tune model (SWA)

# Melanjutkan pelatihan model CIFAR-10 dengan rata-rata bobot (SWA), memilih
# model dan tampilan dari validasi, lalu meng-commit hasilnya ke branch tempat
# workflow dijalankan. Hanya manual (sekitar 5 jam); jalankan dari branch selain
# main supaya model baru masuk lewat pull request.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finetune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the v5 base model from history
        run: git show 72895f7:model_cnn_cifar10_v5.h5 > model_cnn_cifar10_v5.h5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-train.txt

      - name: Fine-tune
        run: |
          set -o pipefail
          mkdir -p results
          python -u scripts/finetune_swa.py --time-budget-minutes 285 2>&1 | tee results/swa_log.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/swa_log.txt results/swa_metrics.json
          if [ -f model_cnn_cifar10_v6.h5 ]; then git add model_cnn_cifar10_v6.h5; fi
          git commit -m "Record SWA fine-tune results (run ${{ github.run_id }})"
          # Branch bisa berubah selama pelatihan; rebase dulu agar push tidak ditolak.
          git pull --rebase
          git push
