name: Verify model accuracy

# Verify ONNX accuracy
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/verify-model.yml
      - scripts/eval_cifar_test.py
      - classify.py
      - model_vit_cifar10.onnx

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install onnxruntime==1.23.2 numpy==2.2.6 pillow==12.0.0

      - name: Download CIFAR-10
        run: |
          mkdir -p data
          curl -sSL -o data/cifar-10-python.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  data/cifar-10-python.tar.gz" | md5sum -c
          tar xzf data/cifar-10-python.tar.gz -C data

      - name: Evaluate through app code and rewrite results
        run: python scripts/eval_cifar_test.py --write-results

      - name: Commit results
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/model_sha256.txt results/confusion_matrix_tta.png
          if git diff --cached --quiet; then
            echo "results/ up to date"
          else
            git commit -m "Record measured test accuracy (run ${{ github.run_id }})"
            git pull --rebase
            git push
          fi
