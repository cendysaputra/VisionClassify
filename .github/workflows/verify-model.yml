name: Verify model accuracy

# Mengukur ulang akurasi model CIFAR-10 yang di-commit pada 10.000 gambar uji resmi.
# Langkah pertama memakai kode terpisah dari aplikasi; langkah kedua memakai jalur
# aplikasi (scripts/eval_cifar_test.py) dan menulis ulang results/.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/verify-model.yml
      - scripts/eval_cifar_test.py
      - classify.py
      - model_cnn_cifar10_*.h5

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install tensorflow-cpu==2.21.0 numpy==2.2.6 pillow==12.0.0

      - name: Download CIFAR-10
        run: |
          mkdir -p data
          curl -sSL -o data/cifar-10-python.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  data/cifar-10-python.tar.gz" | md5sum -c
          tar xzf data/cifar-10-python.tar.gz -C data

      - name: Evaluate with independent code
        run: |
          python - <<'PY'
          import glob, hashlib, pickle
          import numpy as np
          from tensorflow.keras.models import load_model

          (path,) = glob.glob("model_cnn_cifar10_*.h5")
          print("model", path)
          print("sha256", hashlib.sha256(open(path, "rb").read()).hexdigest())
          with open("data/cifar-10-batches-py/test_batch", "rb") as f:
              d = pickle.load(f, encoding="bytes")
          x = d[b"data"].reshape(-1, 3, 32, 32).transpose(0, 2, 3, 1).astype("float32") / 255.0
          y = np.array(d[b"labels"])
          m = load_model(path, compile=False)

          def moved(images, dy, dx):
              # Geser dengan pad nol lalu crop; ditulis terpisah dari classify.shift.
              padded = np.pad(images, ((0, 0), (2, 2), (2, 2), (0, 0)))
              return padded[:, 2 - dy : 34 - dy, 2 - dx : 34 - dx]

          def probs(images):
              return m.predict(images, batch_size=250, verbose=0).astype("float64")

          plain = probs(x)
          total = plain + probs(x[:, :, ::-1])
          print(f"single:      {(plain.argmax(1) == y).sum()}/10000")
          print(f"flip:        {(total.argmax(1) == y).sum()}/10000")
          for dy, dx in ((-1, 0), (1, 0), (0, -1), (0, 1)):
              shifted = moved(x, dy, dx)
              total += probs(shifted) + probs(shifted[:, :, ::-1])
          print(f"flip_shift1: {(total.argmax(1) == y).sum()}/10000")
          PY

      - name: Evaluate through the app code and rewrite results
        run: python scripts/eval_cifar_test.py --write-results

      - name: Commit results
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/model_sha256.txt results/confusion_matrix_tta.png
          if git diff --cached --quiet; then
            echo "results/ sudah sesuai"
          else
            git commit -m "Record measured test accuracy (run ${{ github.run_id }})"
            git pull --rebase
            git push
          fi
