name: Verify model accuracy

# Re-measure the committed CIFAR-10 model on the official 10,000 test images,
# once with code that does not import the app and once through the app code,
# and record where the third-party model came from (Hugging Face card and API).
# Runs on branches other than main and by hand; results are committed to the branch.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/verify-model.yml
      - scripts/eval_cifar_test.py
      - classify.py
      - model_vit_cifar10.onnx

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_MODEL: MF21377197/vit-small-patch16-224-finetuned-Cifar10

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install onnxruntime==1.23.2 numpy==2.2.6 pillow==12.0.0

      - name: Record source model provenance
        run: |
          mkdir -p results/provenance
          out=results/provenance
          curl -fsSL "https://huggingface.co/api/models/$SOURCE_MODEL" | python -m json.tool > "$out/source_model_api.json" || echo "API not available" > "$out/source_model_api.json"
          curl -fsSL "https://huggingface.co/$SOURCE_MODEL/raw/main/README.md" -o "$out/source_model_card.md" || echo "No model card" > "$out/source_model_card.md"
          curl -fsSL "https://huggingface.co/$SOURCE_MODEL/raw/main/config.json" -o "$out/source_model_config.json" || echo "{}" > "$out/source_model_config.json"
          # Training state, if the author uploaded it, shows the eval split and checkpoint choice.
          curl -fsSL "https://huggingface.co/$SOURCE_MODEL/raw/main/trainer_state.json" -o "$out/source_trainer_state.json" || rm -f "$out/source_trainer_state.json"
          echo "--- model card ---"; cat "$out/source_model_card.md"
          echo "--- files ---"; python -c "import json;d=json.load(open('$out/source_model_api.json'));print(d.get('cardData'));print([s['rfilename'] for s in d.get('siblings',[])])" || true

      - name: Download CIFAR-10
        run: |
          mkdir -p data
          curl -sSL -o data/cifar-10-python.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  data/cifar-10-python.tar.gz" | md5sum -c
          tar xzf data/cifar-10-python.tar.gz -C data

      - name: Evaluate with independent code
        run: |
          python - <<'PY'
          import glob, hashlib, pickle
          import numpy as np
          import onnxruntime as ort
          from PIL import Image

          (path,) = glob.glob("model_*cifar10*.onnx")
          print("model", path)
          print("sha256", hashlib.sha256(open(path, "rb").read()).hexdigest())
          with open("data/cifar-10-batches-py/test_batch", "rb") as f:
              d = pickle.load(f, encoding="bytes")
          x = d[b"data"].reshape(-1, 3, 32, 32).transpose(0, 2, 3, 1)
          y = np.array(d[b"labels"])
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          name = session.get_inputs()[0].name
          size = session.get_inputs()[0].shape[-1]
          correct = 0
          for start in range(0, len(x), 100):
              chunk = [np.asarray(Image.fromarray(im).resize((size, size), Image.BILINEAR), np.float32)
                       for im in x[start : start + 100]]
              batch = ((np.stack(chunk) / 255.0 - 0.5) / 0.5).transpose(0, 3, 1, 2).astype(np.float32)
              logits = session.run(None, {name: batch})[0]
              correct += int((logits.argmax(1) == y[start : start + 100]).sum())
          print(f"independent single: {correct}/10000")
          PY

      - name: Evaluate through app code and rewrite results
        run: python scripts/eval_cifar_test.py --write-results

      - name: Commit results
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/model_sha256.txt results/confusion_matrix_tta.png results/provenance
          if git diff --cached --quiet; then
            echo "results/ up to date"
          else
            git commit -m "Record measured test accuracy and model provenance (run ${{ github.run_id }})"
            git pull --rebase
            git push
          fi
